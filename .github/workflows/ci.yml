name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install ruff
      - name: Run ruff
        run: |
          ruff check .

  test-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install -e .[dev]
      - name: Run CPU tests
        run: |
          python -m pytest tests/test_block_manager.py tests/test_scheduler.py tests/test_sampler.py tests/test_e2e_greedy.py::test_model_forward_shape tests/test_e2e_greedy.py::test_model_deterministic -v

  test-gpu:
    runs-on: ubuntu-latest
    if: false  # Enable when GPU runners available
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install -e .[dev,flash-attn]
      - name: Run GPU tests
        run: |
          python -m pytest tests/ -v -m "gpu or model"